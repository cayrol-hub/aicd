spec:
  inputs:
    job_name:
      default: aicd
      description: Name of the job (include the component twice with different names for analyze and review).
    command:
      default: analyze
      description: "aicd command: analyze (end of pipeline), review (merge requests), optimize, release-notes…"
    stage:
      default: .post
      description: Stage of the job. `.post` runs after every other stage, `.pre` before.
    when:
      default: always
      options: [always, on_failure, on_success]
      description: analyze runs `always` so that green pipelines feed the flaky-test history.
    version:
      default: "1"
      description: Version of @aicd/cli to run.
    config:
      default: .aicd.yaml
      description: Path of the configuration file.
    args:
      default: ""
      description: Extra arguments.
---
# Needs masked CI/CD variables:
#   AICD_GITLAB_TOKEN  project access token, scope `api` (reads job logs, posts notes; Developer role for retries and fixes)
#   ANTHROPIC_API_KEY  or set `llm.provider: none` to run with rules only
$[[ inputs.job_name ]]:
  stage: $[[ inputs.stage ]]
  # Not -slim: release notes, risk history and test selection need git.
  image: node:24
  # aicd must never break a pipeline.
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: $[[ inputs.when ]]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: $[[ inputs.when ]]
    - if: $CI_COMMIT_TAG
      when: $[[ inputs.when ]]
  # GitLab keeps separate caches for protected and unprotected refs: merge requests do not see the default branch's
  # state (coverage map, security baseline). Share state across them with the server mode or a Postgres backend.
  cache:
    key: aicd-state
    paths:
      - .aicd/
    when: always
  variables:
    AICD_INPUT_COMMAND: $[[ inputs.command ]]
    AICD_INPUT_CONFIG: $[[ inputs.config ]]
    AICD_INPUT_ARGS: $[[ inputs.args ]]
  script:
    - |
      set -f  # arguments are split on spaces but never glob-expanded
      config_args=""
      if [ -f "$AICD_INPUT_CONFIG" ]; then config_args="--config $AICD_INPUT_CONFIG"; fi
      npx --yes @aicd/cli@$[[ inputs.version ]] $AICD_INPUT_COMMAND --ci gitlab $config_args $AICD_INPUT_ARGS
