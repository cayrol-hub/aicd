name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm format:check
      # The plugin API is frozen: any change must show up in the reviewed report.
      - run: node scripts/api-report.mjs && git diff --exit-code packages/plugin-sdk/api-report.d.ts
      # The configuration schema shipped to editors must match the code.
      - run: node scripts/generate-schema.mjs && git diff --exit-code schema/
      # Release gate: the agents must classify the labelled failures (rules only, no API key needed).
      - run: node packages/cli/dist/bin.js replay --fixtures evals/fixtures --set llm.provider=none --min-accuracy 0.9

  node-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: aicd
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/adapters/state-postgres
        env:
          AICD_TEST_DATABASE_URL: postgres://postgres:aicd@localhost:5432/postgres
