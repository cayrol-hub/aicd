# yaml-language-server: $schema=https://raw.githubusercontent.com/cayrol-hub/aicd/main/schema/aicd.schema.json
# Every section, with typical values. Reference: docs/reference/configuration.md
extends: https://raw.githubusercontent.com/acme/platform/main/aicd-policies.yaml
plugins: []

llm:
  provider: anthropic # anthropic | openai | ollama | none
  model: claude-opus-5-5
  effort: medium
  budget_per_run_usd: 0.3

agents:
  triage: {autonomy: act, retry_flaky: true}
  flaky: {autonomy: act, quarantine_after: 3, release_after: 10, create_issues: true}
  test_selection: {full_suite_on: [main, "release/*"], map_max_age_days: 14}
  security_triage: {autonomy: act, fail_on: high, fix_proposal: true}
  pipeline_optimizer: {autonomy: propose}
  intent_check: {autonomy: act, fail_on_gaps: false}
  risk_score: {autonomy: act, sensitive_paths: ["src/billing/**"], required_approvals: {high: 2}}
  release_notes: {autonomy: propose, audiences: [technical, users]}
  release_guardian:
    autonomy: {default: propose, staging: act, production: propose}
    metrics:
      - {name: http_5xx_rate, source: prometheus, query: 'sum(rate(http_requests_total{code=~"5.."}[5m]))', bad: up}
      - {
          name: p95_latency_seconds,
          source: prometheus,
          query: "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
          bad: up,
          absolute_min: 0.05
        }
    error_source: sentry
    observe_minutes: 15
  postmortem: {autonomy: propose}

integrations:
  trackers:
    - {
        type: jira,
        base_url: "https://acme.atlassian.net",
        email: bot@acme.io,
        api_token_env: JIRA_API_TOKEN,
        project_key: OPS
      }
  metrics_sources:
    prometheus: {type: prometheus, url: "https://prometheus.internal"}
    sentry: {type: sentry, organization: acme, project: api, token_env: SENTRY_AUTH_TOKEN}
  deployer:
    {
      type: argocd,
      url: "https://argocd.internal",
      application: api,
      token_env: ARGOCD_AUTH_TOKEN,
      environment: production
    }
  notifiers:
    - {type: slack, webhook_url_env: SLACK_WEBHOOK_URL, on: [warning, critical]}

privacy: {send_code: diff_only}
comment: {language: fr}
